<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos | FluxoCRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="agendamentos">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">F</span>
        <div>
          <strong>FluxoCRM</strong>
          <small>Protótipo MVP</small>
        </div>
      </div>

      <button class="menu-toggle" type="button" aria-label="Abrir menu">Menu</button>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="atendimentos.html">Atendimentos</a>
        <a class="active" href="agendamentos.html">Agendamentos</a>
        <a href="mensagens.html">Mensagens prontas</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Compromissos</p>
          <h1>Agendamentos</h1>
          <p>Organize serviço, data, horário e status de cada compromisso.</p>
        </div>
        <button class="primary-button" type="button">Novo agendamento</button>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>Lista de agendamentos</h2>
          <span class="panel-count" id="appointmentsCount">0 agendamentos</span>
        </div>
        <div class="responsive-table">
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Serviço</th>
                <th>Data</th>
                <th>Horário</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="appointmentsTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
