<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FluxoCRM — Cadastro e consulta de clientes.">
  <title>Clientes | FluxoCRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="clientes">

  <div class="mobile-overlay" id="mobile-overlay" aria-hidden="true"></div>

  <div class="app-layout" id="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="sidebar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">F</span>
          <div class="brand-text">
            <span class="brand-name">FluxoCRM</span>
            <span class="brand-tagline">Gestão de atendimento</span>
          </div>
        </div>

        <nav class="main-nav" aria-label="Navegação principal">
          <span class="nav-group-label">Principal</span>
          <a class="nav-item" id="nav-item-dashboard" href="index.html">
            <span class="nav-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span>
            <span class="nav-item-label">Visão Geral</span>
          </a>
          <a class="nav-item" id="nav-item-agenda" href="agenda.html">
            <span class="nav-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
            <span class="nav-item-label">Agenda</span>
          </a>
          <a class="nav-item" id="nav-item-solicitacoes" href="solicitacoes.html">
            <span class="nav-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
            <span class="nav-item-label">Solicitações</span>
          </a>
        </nav>

        <nav class="main-nav" aria-label="Gestão">
          <span class="nav-group-label">Gestão</span>
          <a class="nav-item active" id="nav-item-clientes" href="clientes.html" aria-current="page">
            <span class="nav-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span class="nav-item-label">Clientes</span>
          </a>
          <a class="nav-item" id="nav-item-servicos" href="servicos.html">
            <span class="nav-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg></span>
            <span class="nav-item-label">Serviços</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" type="button" aria-expanded="true" aria-label="Recolher menu lateral">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 5 12 12 19"/></svg>
            <span class="nav-item-label">Recolher menu</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- ── Conteúdo ── -->
    <div style="min-width:0; display:flex; flex-direction:column;">
      <div class="mobile-topbar" role="banner">
        <button class="menu-toggle" id="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir menu de navegação">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-brand">
          <span aria-hidden="true" style="width:24px;height:24px;background:var(--color-primary);border-radius:4px;display:grid;place-items:center;color:#0f1117;font-weight:800;font-size:12px;">F</span>
          FluxoCRM
        </span>
      </div>

      <main class="main-content" id="main-content" tabindex="-1">

        <header class="page-header">
          <div class="page-header-info">
            <span class="page-eyebrow">Cadastro</span>
            <h1>Clientes</h1>
            <p class="page-header-desc">Consulte e cadastre os clientes do seu atendimento.</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="btn-novo-cliente-header" type="button"
                    aria-label="Ir para formulário de novo cliente">
              <svg aria-hidden="true" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Novo cliente
            </button>
          </div>
        </header>

        <div class="content-grid two-columns reverse-mobile">

          <!-- Listagem -->
          <article class="panel">
            <div class="panel-header">
              <h2>Clientes cadastrados</h2>
              <span class="panel-count" id="clientsCount">0 clientes</span>
            </div>
            <div class="responsive-table panel-body-flush">
              <table aria-label="Lista de clientes cadastrados">
                <thead>
                  <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Telefone</th>
                    <th scope="col">Origem</th>
                    <th scope="col">Observações</th>
                  </tr>
                </thead>
                <tbody id="clientsTable"></tbody>
              </table>
            </div>
          </article>

          <!-- Formulário -->
          <article class="panel form-panel" id="painel-form-cliente">
            <div class="panel-header">
              <h2 id="cliente-form-titulo">Novo cliente</h2>
            </div>
            <div class="panel-body">
              <form class="simple-form" id="form-cliente" novalidate aria-label="Formulário de cadastro de cliente">

                <label>
                  Nome completo <span aria-hidden="true" style="color:var(--color-danger)">*</span>
                  <input type="text" id="nome-cliente" placeholder="Ex.: Ana Souza"
                         required aria-required="true" autocomplete="name">
                </label>

                <label>
                  Telefone <span aria-hidden="true" style="color:var(--color-danger)">*</span>
                  <input type="tel" id="telefone-cliente" placeholder="Ex.: (11) 99999-0000"
                         maxlength="15" inputmode="numeric"
                         required aria-required="true" autocomplete="tel">
                </label>

                <label>
                  Origem do contato
                  <select id="origem-cliente" aria-label="Origem do contato">
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Ligação">Ligação</option>
                    <option value="Formulário">Formulário</option>
                    <option value="Indicação">Indicação</option>
                  </select>
                </label>

                <label>
                  Observações
                  <textarea id="observacoes-cliente" rows="4"
                    placeholder="Preferências, contexto do contato ou informações relevantes"></textarea>
                </label>

                <div class="form-actions">
                  <button class="secondary-button" type="submit" id="salvar-cliente">Cadastrar cliente</button>
                </div>
                <p class="form-feedback" id="clientes-feedback" aria-live="polite" role="status"></p>
              </form>
            </div>
          </article>

        </div>

      </main>
    </div>
  </div>

  <script src="js/core/namespace.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/compartilhado/utilitarios.js"></script>
  <script src="js/compartilhado/status.js"></script>
  <script src="js/compartilhado/datas.js"></script>
  <script src="js/modelos/cliente.js"></script>
  <script src="js/modelos/servico.js"></script>
  <script src="js/modelos/solicitacao.js"></script>
  <script src="js/modelos/agendamento.js"></script>
  <script src="js/dados/dados-simulados.js"></script>
  <script src="js/repositories/criarColecaoRepository.js"></script>
  <script src="js/repositories/clientesRepository.js"></script>
  <script src="js/repositories/servicosRepository.js"></script>
  <script src="js/repositories/solicitacoesRepository.js"></script>
  <script src="js/repositories/agendamentosRepository.js"></script>
  <script src="js/modulos/menu.js"></script>
  <script src="js/modulos/clientes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
